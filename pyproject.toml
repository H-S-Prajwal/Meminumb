[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meminumb"
version = "0.2.0"
description = "Lightweight, reliable memory layer for AI agents — atomic writes, explicit outcomes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["ai", "memory", "agents", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
local = ["sentence-transformers>=2.7"]
openai = ["openai>=1.0"]
groq = ["groq>=0.9"]
langchain = ["langchain-core>=0.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/H-S-Prajwal/Meminumb"
Issues = "https://github.com/H-S-Prajwal/Meminumb/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
